# SonarCloud Project Configuration for OmniKeeper (AegisAgent)
sonar.projectKey=tondays52_omnikeeper
sonar.organization=tondays52
sonar.projectName=OmniKeeper (AegisAgent)
sonar.projectVersion=1.2.0

# Source and Test Inclusions
sonar.sources=packages/agent-core/src,packages/plugin-eliza/src,packages/dashboard/src,packages/bounty-contribution/polymarket-plugin/src
sonar.tests=packages/agent-core/src/test,packages/bounty-contribution/polymarket-plugin/test

# Encodings and Language
sonar.sourceEncoding=UTF-8

# Exclusions to prevent false duplication metrics on build artifacts and static assets
sonar.exclusions=**/dist/**,**/build/**,**/node_modules/**,**/docs/demo/**,**/*.webm,**/*.png,**/*.log,**/*.json
sonar.cpd.exclusions=**/*.test.ts,**/docs/**,**/packages/workflows/**

# Quality Gate Settings
sonar.javascript.environments=node,browser
sonar.typescript.tsconfigPaths=packages/agent-core/tsconfig.json,packages/plugin-eliza/tsconfig.json,packages/dashboard/tsconfig.json,packages/bounty-contribution/polymarket-plugin/tsconfig.json
