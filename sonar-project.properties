# Encodings and Language
sonar.sourceEncoding=UTF-8

# Exclusions to prevent false duplication metrics on build artifacts, static assets, and test suites
sonar.exclusions=**/dist/**,**/build/**,**/node_modules/**,**/docs/demo/**,**/*.webm,**/*.png,**/*.log,**/*.json,**/src/test/**,**/test/**
sonar.cpd.exclusions=**/*.test.ts,**/test/**,**/src/test/**,**/docs/**,**/packages/workflows/**,**/packages/dashboard/**,**/actions/actionHelper.ts

# Quality Gate Settings
sonar.javascript.environments=node,browser
sonar.typescript.tsconfigPaths=packages/agent-core/tsconfig.json,packages/plugin-eliza/tsconfig.json,packages/dashboard/tsconfig.json,packages/bounty-contribution/polymarket-plugin/tsconfig.json


